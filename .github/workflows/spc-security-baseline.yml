name: SPC security baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 1"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: spc-security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-runtime-build:
    name: Node 24 production build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65535
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match the Vercel Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify immutable FCUNO-FCOS contract
        run: npm run contract:verify

      - name: Build the production application
        run: npm run build

      - name: Verify pinned font assets and routing boundaries
        run: npx --no-install tsx --test tests/roboto-self-hosting.test.ts

      - name: Verify font delivery in the built production server
        run: node tests/roboto-self-hosting.production.test.cjs

  static-security-evidence:
    name: Focused tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Run focused security tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee security-tests.tap

      - name: Run federation contract and implementation tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:federation 2>&1 | tee federation-tests.tap

      - name: Run attendance import and FCUNO calendar regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:attendance 2>&1 | tee attendance-tests.tap

      - name: Verify calendar saves holidays recovery and reminder delivery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:calendars 2>&1 | tee calendar-tests.tap

      - name: Verify CCINFO table save and failure handling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/ccinfo-table-persistence.test.ts 2>&1 | tee ccinfo-table-tests.tap

      - name: Verify country renaming and coherent pricing publication
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/ccinfo*.test.ts tests/price-setter*.test.ts tests/admin-price-history.test.ts tests/market-price-history.test.ts tests/price-history-records.test.ts tests/report-publication*.test.ts 2>&1 | tee country-pricing-tests.tap

      - name: Verify Outlook contact validation and atomic update boundary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/outlook-contact-validation.test.ts tests/outlook-group*.test.ts 2>&1 | tee outlook-contact-tests.tap

      - name: Verify atomic SPC STEM fixture application and permissions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-stem-api.test.ts tests/spc-fixture-api.test.ts 2>&1 | tee spc-stem-tests.tap

      - name: Verify supplier concurrency and Outlook draft recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-supplier-api.test.ts tests/outlook-edit-recovery.test.ts tests/outlook-exchange-health-alerts.test.ts 2>&1 | tee supplier-outlook-reliability-tests.tap

      - name: Verify revision ownership remarks saves and audit visibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-record-state-api.test.ts tests/spc-lost-reasons-and-today-enquiries.test.ts tests/spc-presentation-layout.test.ts tests/taiwan-remarks-save.test.ts tests/audit-log-supplier-visibility.test.ts tests/audit-browsing.test.ts tests/tech-stack-register.test.ts 2>&1 | tee state-integrity-tests.tap

      - name: Verify complete analytics snapshots and failure ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/openai-usage-report.test.ts tests/spc-statistics*.test.ts 2>&1 | tee report-correctness-tests.tap

      - name: Verify SPC operational reads and historical vessel matching
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx --test tests/spc-operational-response.test.ts tests/spc-record-page-response.test.ts tests/spc-enquiry-ownership.test.ts 2>&1 | tee spc-operational-response-tests.tap
          node --test tests/spc-operational-api.test.mjs tests/spc-today-enquiries-api.test.mjs tests/spc-enquiry-list-permissions.test.mjs tests/spc-record-pages-api.test.mjs 2>&1 | tee spc-operational-api-tests.tap

      - name: Verify directory query boundaries and feedback revision ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-feedback*.test.ts 2>&1 | tee directory-feedback-tests.tap
          node --import tsx --test tests/ccinfo-index-sdk.test.mjs 2>&1 | tee directory-sdk-tests.tap

      - name: Verify streaming backup validation at full inventory scale
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          FCUNO_BACKUP_SCALE_TEST=1 node --test tests/backup-validation-stream.test.mjs 2>&1 | tee backup-stream-tests.tap

      - name: Verify backup protection and bounded truth export
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/backup-protection-*.test.ts tests/backup-truth-snapshot-export.test.ts tests/drive-file-backup-health.test.ts tests/system-health-alerts.test.ts tests/system-health-backup-window.test.ts 2>&1 | tee backup-protection-tests.tap

      - name: Verify transactional SQL policies with isolated PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-backup-gap-test-runtime"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund @electric-sql/pglite@0.5.8
          npm audit signatures --prefix "$test_runtime"
          PGLITE_MODULE_PATH="$test_runtime/node_modules/@electric-sql/pglite/dist/index.js" node --import tsx --test tests/backup-protection-flow.test.mjs tests/backup-protection-gaps-sql.test.mjs tests/system-health-alerts-sql.test.mjs tests/outlook-template-save-policy.test.mjs tests/spc-supplier-sql.test.mjs tests/taiwan-remarks-save-sql.test.mjs tests/taiwan-remarks-publication.test.mjs tests/openai-usage-report-sql.test.mjs tests/spc-statistics-sql.test.mjs tests/ccinfo-delete-sql.test.mjs tests/spc-feedback-state.test.mjs 2>&1 | tee backup-protection-sql-tests.tap

      - name: Verify phonebook delivery, retry and failure reporting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/phonebook-*.test.ts 2>&1 | tee phonebook-sync-tests.tap

      - name: Verify deterministic enquiry parser and caller regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/enquiry-parsers.test.ts tests/enquiry-parser-correctness.test.ts 2>&1 | tee enquiry-parser-tests.tap

      - name: Verify optional client storage and Exchange trigger acknowledgement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/client-storage.test.ts tests/client-session-store.test.ts tests/browser-session-owner.test.ts tests/outlook-exchange-sync-trigger.test.ts tests/outlook-recipient-map-continuity.test.ts 2>&1 | tee session-trigger-tests.tap

      - name: Preserve reviewed live Exchange worker and isolated retry/notification regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:exchange-worker 2>&1 | tee exchange-worker-tests.txt

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee security-audit-production.json

      - name: Audit all dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee security-audit-full.json

      - name: Verify npm registry signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm audit signatures 2>&1 | tee npm-signature-audit.txt

      - name: Generate production CycloneDX SBOM
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom-production.cdx.json

      - name: Extract informational open-source licence inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/summarize-sbom-licenses.mjs sbom-production.cdx.json > sbom-production-licenses.json

      - name: Retain sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spc-security-evidence-${{ github.run_id }}
          path: |
            security-tests.tap
            federation-tests.tap
            attendance-tests.tap
            calendar-tests.tap
            ccinfo-table-tests.tap
            country-pricing-tests.tap
            outlook-contact-tests.tap
            spc-stem-tests.tap
            supplier-outlook-reliability-tests.tap
            state-integrity-tests.tap
            report-correctness-tests.tap
            spc-operational-response-tests.tap
            spc-operational-api-tests.tap
            directory-feedback-tests.tap
            directory-sdk-tests.tap
            backup-stream-tests.tap
            backup-protection-tests.tap
            backup-protection-sql-tests.tap
            phonebook-sync-tests.tap
            enquiry-parser-tests.tap
            session-trigger-tests.tap
            exchange-worker-tests.txt
            security-audit-production.json
            security-audit-full.json
            npm-signature-audit.txt
            sbom-production.cdx.json
            sbom-production-licenses.json
          if-no-files-found: warn
          retention-days: 90

  report-browser-regressions:
    name: Report browser state desktop and mobile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify report requests and layout in isolated Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-report-browser-runtime"
          evidence_dir="${RUNNER_TEMP}/fcuno-report-browser-evidence"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund playwright@1.62.1
          npm audit --prefix "$test_runtime" --audit-level=high
          npm audit signatures --prefix "$test_runtime"
          export NODE_PATH="$test_runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/fcuno-report-browser-cache"
          "$test_runtime/node_modules/.bin/playwright" install --with-deps chromium webkit
          OPENAI_USAGE_SCREENSHOTS="$evidence_dir/usage" node tests/openai-usage-state.browser.test.cjs 2>&1 | tee "$test_runtime/usage.log"
          SPC_STATISTICS_SCREENSHOTS="$evidence_dir/statistics" node tests/spc-statistics-state.browser.test.cjs 2>&1 | tee "$test_runtime/statistics.log"
          ADMIN_VIEW_FILTERS_SCREENSHOTS="$evidence_dir/view-filters" node tests/admin-view-filters.browser.test.cjs 2>&1 | tee "$test_runtime/view-filters.log"
          mkdir -p "$evidence_dir/enquiry-parser"
          ENQUIRY_CORRECTNESS_EVIDENCE="$evidence_dir/enquiry-parser" node tests/enquiry-parser-correctness.browser.test.cjs 2>&1 | tee "$test_runtime/enquiry-parser.log"

      - name: Retain synthetic browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-browser-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fcuno-report-browser-evidence
            ${{ runner.temp }}/fcuno-report-browser-runtime/usage.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/statistics.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/view-filters.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/enquiry-parser.log
          if-no-files-found: warn
          retention-days: 90

  directory-feedback-browser-regressions:
    name: Directory and feedback desktop and mobile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify directory and feedback ownership in isolated Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-directory-browser-runtime"
          evidence_dir="${RUNNER_TEMP}/fcuno-directory-browser-evidence"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund playwright@1.62.1
          npm audit --prefix "$test_runtime" --audit-level=high
          npm audit signatures --prefix "$test_runtime"
          export NODE_PATH="$test_runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/fcuno-directory-browser-cache"
          "$test_runtime/node_modules/.bin/playwright" install --with-deps chromium webkit
          CCINFO_INDEX_SCREENSHOTS="$evidence_dir/directory" node tests/ccinfo-index-state.browser.test.cjs 2>&1 | tee "$test_runtime/directory.log"
          SPC_FEEDBACK_SCREENSHOTS="$evidence_dir/feedback" node tests/spc-feedback-state.browser.test.cjs 2>&1 | tee "$test_runtime/feedback.log"
          CCINFO_DELETE_SCREENSHOTS="$evidence_dir/core" node tests/ccinfo-delete.browser.test.cjs 2>&1 | tee "$test_runtime/core.log"

      - name: Retain synthetic directory and feedback verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directory-feedback-browser-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fcuno-directory-browser-evidence
            ${{ runner.temp }}/fcuno-directory-browser-runtime/directory.log
            ${{ runner.temp }}/fcuno-directory-browser-runtime/feedback.log
            ${{ runner.temp }}/fcuno-directory-browser-runtime/core.log
          if-no-files-found: warn
          retention-days: 90

  calendar-session-browser-regressions:
    name: Calendar and session ownership desktop and mobile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify calendar reads and account replacement in isolated browsers
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-calendar-session-browser-runtime"
          evidence_dir="${RUNNER_TEMP}/fcuno-calendar-session-browser-evidence"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund playwright@1.62.1
          npm audit --prefix "$test_runtime" --audit-level=high
          npm audit signatures --prefix "$test_runtime"
          export NODE_PATH="$test_runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/fcuno-calendar-session-browser-cache"
          "$test_runtime/node_modules/.bin/playwright" install --with-deps chromium webkit
          EVENT_CALENDAR_RESPONSE_SCREENSHOTS="$evidence_dir/calendar" node tests/event-calendar-response.browser.test.cjs 2>&1 | tee "$test_runtime/calendar.log"
          CLIENT_SESSION_OWNERSHIP_SCREENSHOTS="$evidence_dir/ownership" node tests/client-session-ownership.browser.test.cjs 2>&1 | tee "$test_runtime/ownership.log"
          node tests/client-session-storage.browser.test.cjs 2>&1 | tee "$test_runtime/storage.log"
          SPC_OPERATIONAL_SCREENSHOTS="$evidence_dir/spc-operational" node tests/spc-operational-state.browser.test.cjs 2>&1 | tee "$test_runtime/spc-operational.log"
          SPC_RECORD_STATE_SCREENSHOTS="$evidence_dir/spc-record-state" node tests/spc-record-state.browser.test.cjs 2>&1 | tee "$test_runtime/spc-record-state.log"
          SPC_RECORD_PAGES_SCREENSHOTS="$evidence_dir/spc-record-pages" node tests/spc-record-pages-state.browser.test.cjs 2>&1 | tee "$test_runtime/spc-record-pages.log"
          SPC_LOST_DATE_SCREENSHOTS="$evidence_dir/lost-date" node tests/spc-lost-record-date.browser.test.cjs 2>&1 | tee "$test_runtime/lost-date.log"
          AUDIT_BROWSING_SCREENSHOTS="$evidence_dir/audit" node tests/audit-browsing-state.browser.test.cjs 2>&1 | tee "$test_runtime/audit.log"

      - name: Retain synthetic calendar and session verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calendar-session-browser-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fcuno-calendar-session-browser-evidence
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/calendar.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/ownership.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/storage.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/spc-operational.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/spc-record-state.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/spc-record-pages.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/lost-date.log
            ${{ runner.temp }}/fcuno-calendar-session-browser-runtime/audit.log
          if-no-files-found: warn
          retention-days: 90

  live-production-baseline:
    name: Read-only production baseline
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.static-security-evidence.result != 'cancelled' }}
    needs: static-security-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check both production hostnames
        shell: bash
        run: |
          set -o pipefail
          npm run security:check-live 2>&1 | tee live-security-baseline.txt

      - name: Retain live-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spc-live-security-baseline-${{ github.run_id }}
          path: live-security-baseline.txt
          if-no-files-found: warn
          retention-days: 90
