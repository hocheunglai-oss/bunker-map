name: SPC security baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 1"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: spc-security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-runtime-build:
    name: Node 24 production build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65535
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match the Vercel Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify immutable FCUNO-FCOS contract
        run: npm run contract:verify

      - name: Verify compiler import-error release guard
        run: node --test tests/production-build-guard.test.mjs

      - name: Build the production application
        run: npm run build

      - name: Verify pinned font assets and routing boundaries
        run: npx --no-install tsx --test tests/roboto-self-hosting.test.ts

      - name: Verify font delivery in the built production server
        run: node tests/roboto-self-hosting.production.test.cjs

      - name: Verify uploaded-file health service in the actual compiled route
        run: node tests/storage-media-health.production.test.cjs

  static-security-evidence:
    name: Focused tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Run focused security tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee security-tests.tap

      - name: Run federation contract and implementation tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:federation 2>&1 | tee federation-tests.tap

      - name: Verify metadata-only daily backup receipt route
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/daily-backup-provider-receipt-route.test.ts 2>&1 | tee daily-backup-provider-receipt.tap

      - name: Verify canonical conflicts and versioned permission-group save ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx --test tests/email-templates-canonical.test.ts 2>&1 | tee canonical-template-conflicts.tap
          node --test --test-reporter=tap tests/admin-role-default-save.test.mjs tests/admin-permission-groups-api.test.mjs 2>&1 | tee admin-role-default-save.tap
          node --conditions=react-server --import tsx --test --test-reporter=tap tests/admin-auth-security.test.ts 2>&1 | tee admin-auth-security.tap
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import {readFileSync} from "node:fs"
          const text=readFileSync("admin-role-default-save.tap","utf8")
          for(const [name,expected] of [["tests",24],["pass",24],["fail",0],["cancelled",0],["skipped",0]]){
            const values=[...text.matchAll(new RegExp("^# "+name+" (\\d+)","gm"))]
            assert.equal(Number(values.at(-1)?.[1]),expected,name)
          }
          NODE

      - name: Run attendance import and FCUNO calendar regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:attendance 2>&1 | tee attendance-tests.tap
          node --test tests/attendance-auto-confirm-route.test.mjs 2>&1 | tee attendance-auto-confirm-route.tap
          node --test tests/backup-attendance*.test.mjs 2>&1 | tee backup-attendance-schema.tap

      - name: Verify calendar saves holidays recovery and reminder delivery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:calendars 2>&1 | tee calendar-tests.tap

      - name: Verify CCINFO table save and failure handling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/ccinfo-table-persistence.test.ts 2>&1 | tee ccinfo-table-tests.tap

      - name: Verify country renaming and coherent pricing publication
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/ccinfo*.test.ts tests/price-setter*.test.ts tests/admin-price-history.test.ts tests/market-price-history.test.ts tests/price-history-records.test.ts tests/report-publication*.test.ts 2>&1 | tee country-pricing-tests.tap

      - name: Verify Outlook contact validation and atomic update boundary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/outlook-contact-validation.test.ts tests/outlook-group*.test.ts 2>&1 | tee outlook-contact-tests.tap

      - name: Verify homepage fallback read and failure-cache boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --test tests/homepage-market-data.test.cjs 2>&1 | tee homepage-market-data-tests.tap

      - name: Verify atomic SPC STEM fixture application and permissions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-stem-api.test.ts tests/spc-fixture-api.test.ts 2>&1 | tee spc-stem-tests.tap

      - name: Verify exact SPC write conflicts and unconfirmed outcomes through the SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          NODE_OPTIONS=--conditions=react-server node --import tsx --test --test-reporter=tap tests/spc-write-conflicts-api.test.mjs 2>&1 | tee spc-write-conflicts.tap
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import {readFileSync} from "node:fs"
          const text=readFileSync("spc-write-conflicts.tap","utf8")
          for(const [name,expected] of [["tests",59],["pass",59],["fail",0],["cancelled",0],["skipped",0]]){
            const values=[...text.matchAll(new RegExp("^# "+name+" (\\d+)","gm"))]
            assert.equal(Number(values.at(-1)?.[1]),expected,name)
          }
          NODE

      - name: Verify supplier concurrency and Outlook draft recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-supplier-api.test.ts tests/outlook-edit-recovery.test.ts tests/outlook-exchange-health-alerts.test.ts tests/outlook-insertion-transport-deadlines.test.ts tests/outlook-template-source-binding.test.ts tests/outlook-recipient-update-notice.test.ts 2>&1 | tee supplier-outlook-reliability-tests.tap

      - name: Verify revision ownership remarks saves and audit visibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-record-state-api.test.ts tests/spc-presentation-preservation.test.ts tests/spc-lost-reasons-and-today-enquiries.test.ts tests/spc-presentation-layout.test.ts tests/taiwan-remarks-save.test.ts tests/audit-log-supplier-visibility.test.ts tests/audit-browsing.test.ts tests/tech-stack-register.test.ts 2>&1 | tee state-integrity-tests.tap

      - name: Verify complete analytics snapshots and failure ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/openai-usage-report.test.ts tests/spc-statistics*.test.ts 2>&1 | tee report-correctness-tests.tap

      - name: Verify SPC operational reads and historical vessel matching
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx --test tests/spc-operational-response.test.ts tests/spc-record-page-response.test.ts tests/spc-enquiry-ownership.test.ts 2>&1 | tee spc-operational-response-tests.tap
          node --test tests/spc-operational-api.test.mjs tests/spc-today-enquiries-api.test.mjs tests/spc-enquiry-list-permissions.test.mjs tests/spc-record-pages-api.test.mjs tests/spc-record-page-conflict-api.test.mjs 2>&1 | tee spc-operational-api-tests.tap

      - name: Verify directory query boundaries and feedback revision ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/spc-feedback*.test.ts 2>&1 | tee directory-feedback-tests.tap
          node --import tsx --test tests/ccinfo-index-sdk.test.mjs 2>&1 | tee directory-sdk-tests.tap

      - name: Verify one-time and recurring media identity streams copies and publication fences
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          FCUNO_MEDIA_REFERENCE_SCALE_TEST=1 node --max-old-space-size=256 --import tsx --test tests/storage-media-*.test.mjs tests/storage-media-backup-source.test.ts tests/backup-media-reference-stream.test.mjs 2>&1 | tee storage-media-backup-tests.tap

      - name: Verify cloud budget observations conservative pause and retention safeguards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/backup-operating-policy.test.mjs tests/backup-budget-guard.test.mjs tests/backup-budget-pubsub.test.mjs tests/drive-file-backup-runner.test.mjs 2>&1 | tee backup-operating-policy-tests.tap

      - name: Verify streaming backup validation at full inventory scale
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          FCUNO_BACKUP_SCALE_TEST=1 node --test tests/backup-validation-stream.test.mjs 2>&1 | tee backup-stream-tests.tap

      - name: Verify backup protection and bounded truth export
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/backup-protection-*.test.ts tests/backup-truth-snapshot-export.test.ts tests/drive-file-backup-health.test.ts tests/storage-media-backup-health.test.ts tests/system-health-alerts.test.ts tests/system-health-backup-window.test.ts 2>&1 | tee backup-protection-tests.tap
          node --test --test-reporter=tap tests/backup-receipt-description.test.mjs 2>&1 | tee backup-receipt-description.tap

      - name: Verify nonretryable backup observation failures through the SDK callback
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/backup-protection-conflicts-api.test.mjs 2>&1 | tee backup-observation-conflicts.tap
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import {readFileSync} from "node:fs"
          const text=readFileSync("backup-observation-conflicts.tap","utf8")
          for(const [name,expected] of [["tests",12],["pass",12],["fail",0],["cancelled",0],["skipped",0]]){
            const values=[...text.matchAll(new RegExp("^# "+name+" (\\d+)","gm"))]
            assert.equal(Number(values.at(-1)?.[1]),expected,name)
          }
          NODE

      - name: Verify transactional SQL policies with isolated PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-backup-gap-test-runtime"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund @electric-sql/pglite@0.5.8
          npm audit signatures --prefix "$test_runtime"
          # The unchanged usage SQL cases run on native PostgreSQL below:
          # Node24's upstream Wasm import-wrapper/code-GC race (#66366) can
          # abort PGlite during repeated instance teardown. Keep every case;
          # do not retry/skip assertions or disable engine memory protection.
          PGLITE_MODULE_PATH="$test_runtime/node_modules/@electric-sql/pglite/dist/index.js" node --import tsx --test tests/backup-protection-flow.test.mjs tests/backup-protection-gaps-sql.test.mjs tests/system-health-alerts-sql.test.mjs tests/outlook-template-save-policy.test.mjs tests/spc-supplier-sql.test.mjs tests/taiwan-remarks-save-sql.test.mjs tests/taiwan-remarks-publication.test.mjs tests/spc-statistics-sql.test.mjs tests/ccinfo-delete-sql.test.mjs tests/spc-feedback-state.test.mjs 2>&1 | tee backup-protection-sql-tests.tap

      - name: Verify phonebook delivery, retry and failure reporting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/phonebook-*.test.ts 2>&1 | tee phonebook-sync-tests.tap

      - name: Verify deterministic enquiry parser and caller regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsx --test tests/enquiry-parsers.test.ts tests/enquiry-parser-correctness.test.ts tests/enquiry-product-metadata.test.ts 2>&1 | tee enquiry-parser-tests.tap

      - name: Verify optional client storage and Exchange trigger acknowledgement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS=--conditions=react-server npx --no-install tsx --test tests/client-storage.test.ts tests/client-session-store.test.ts tests/browser-session-owner.test.ts tests/outlook-exchange-sync-trigger.test.ts tests/outlook-recipient-map-continuity.test.ts 2>&1 | tee session-trigger-tests.tap

      - name: Preserve reviewed live Exchange worker and isolated retry/notification regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          export FCUNO_PWSH_PATH="$(command -v pwsh)"
          npm run test:exchange-worker 2>&1 | tee exchange-worker-tests.txt

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee security-audit-production.json

      - name: Audit all dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee security-audit-full.json

      - name: Verify npm registry signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm audit signatures 2>&1 | tee npm-signature-audit.txt

      - name: Generate production CycloneDX SBOM
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom-production.cdx.json

      - name: Extract informational open-source licence inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/summarize-sbom-licenses.mjs sbom-production.cdx.json > sbom-production-licenses.json

      - name: Retain sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spc-security-evidence-${{ github.run_id }}
          path: |
            security-tests.tap
            federation-tests.tap
            daily-backup-provider-receipt.tap
            canonical-template-conflicts.tap
            admin-role-default-save.tap
            admin-auth-security.tap
            attendance-tests.tap
            attendance-auto-confirm-route.tap
            backup-attendance-schema.tap
            calendar-tests.tap
            ccinfo-table-tests.tap
            country-pricing-tests.tap
            homepage-market-data-tests.tap
            outlook-contact-tests.tap
            spc-stem-tests.tap
            spc-write-conflicts.tap
            supplier-outlook-reliability-tests.tap
            state-integrity-tests.tap
            report-correctness-tests.tap
            spc-operational-response-tests.tap
            spc-operational-api-tests.tap
            directory-feedback-tests.tap
            directory-sdk-tests.tap
            storage-media-backup-tests.tap
            backup-operating-policy-tests.tap
            backup-stream-tests.tap
            backup-protection-tests.tap
            backup-receipt-description.tap
            backup-observation-conflicts.tap
            backup-protection-sql-tests.tap
            phonebook-sync-tests.tap
            enquiry-parser-tests.tap
            session-trigger-tests.tap
            exchange-worker-tests.txt
            security-audit-production.json
            security-audit-full.json
            npm-signature-audit.txt
            sbom-production.cdx.json
            sbom-production-licenses.json
          if-no-files-found: warn
          retention-days: 90

  report-browser-regressions:
    name: Report browser state desktop and mobile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify report requests and layout in isolated Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-report-browser-runtime"
          evidence_dir="${RUNNER_TEMP}/fcuno-report-browser-evidence"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund playwright@1.62.1
          npm audit --prefix "$test_runtime" --audit-level=high
          npm audit signatures --prefix "$test_runtime"
          export NODE_PATH="$test_runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/fcuno-report-browser-cache"
          "$test_runtime/node_modules/.bin/playwright" install --with-deps chromium webkit
          OPENAI_USAGE_SCREENSHOTS="$evidence_dir/usage" node tests/openai-usage-state.browser.test.cjs 2>&1 | tee "$test_runtime/usage.log"
          SPC_STATISTICS_SCREENSHOTS="$evidence_dir/statistics" node tests/spc-statistics-state.browser.test.cjs 2>&1 | tee "$test_runtime/statistics.log"
          ADMIN_VIEW_FILTERS_SCREENSHOTS="$evidence_dir/view-filters" node tests/admin-view-filters.browser.test.cjs 2>&1 | tee "$test_runtime/view-filters.log"
          ADMIN_VIEW_CONTROL_EVIDENCE="$evidence_dir/view-control-state" node tests/admin-view-control-state.browser.test.cjs 2>&1 | tee "$test_runtime/view-control-state.log"
          PERMISSION_GROUP_SCREENSHOTS="$evidence_dir/permission-groups" node tests/admin-permission-groups.browser.test.cjs 2>&1 | tee "$test_runtime/permission-groups.log"
          TECH_STACK_SCREENSHOTS="$evidence_dir/tech-stack" node tests/tech-stack-reliability.browser.test.cjs 2>&1 | tee "$test_runtime/tech-stack.log"
          mkdir -p "$evidence_dir/enquiry-parser"
          ENQUIRY_CORRECTNESS_EVIDENCE="$evidence_dir/enquiry-parser" node tests/enquiry-parser-correctness.browser.test.cjs 2>&1 | tee "$test_runtime/enquiry-parser.log"
          SPC_ENQUIRY_METADATA_EVIDENCE="$evidence_dir/spc-enquiry-metadata" node tests/spc-enquiry-metadata.browser.test.cjs 2>&1 | tee "$test_runtime/spc-enquiry-metadata.log"
          STORAGE_MEDIA_HEALTH_SCREENSHOTS="$evidence_dir/storage-media-health" node tests/storage-media-system-health.browser.test.cjs 2>&1 | tee "$test_runtime/storage-media-health.log"
          HOMEPAGE_SCREENSHOTS="$evidence_dir/homepage-market" node tests/homepage-market.browser.test.cjs 2>&1 | tee "$test_runtime/homepage-market.log"

      - name: Retain synthetic browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-browser-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fcuno-report-browser-evidence
            ${{ runner.temp }}/fcuno-report-browser-runtime/usage.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/statistics.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/view-filters.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/view-control-state.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/permission-groups.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/tech-stack.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/enquiry-parser.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/spc-enquiry-metadata.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/storage-media-health.log
            ${{ runner.temp }}/fcuno-report-browser-runtime/homepage-market.log
          if-no-files-found: warn
          retention-days: 90

  phonebook-browser-regressions:
    name: Phonebook ownership desktop and mobile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Phonebook writes and ownership in isolated Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          test_runtime="${RUNNER_TEMP}/fcuno-phonebook-browser-runtime"
          evidence_dir="${RUNNER_TEMP}/fcuno-phonebook-browser-evidence"
          npm install --prefix "$test_runtime" --ignore-scripts --no-fund playwright@1.62.1
          npm audit --prefix "$test_runtime" --audit-level=high
          npm audit signatures --prefix "$test_runtime"
          export NODE_PATH="$test_runtime/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/fcuno-phonebook-browser-cache"
          "$test_runtime/node_modules/.bin/playwright" install --with-deps chromium webkit
          mkdir -p "$evidence_dir"
          PHONEBOOK_SCREENSHOT="$evidence_dir/phonebook-sync.png" node tests/phonebook-sync.browser.test.cjs 2>&1 | tee "$test_runtime/phonebook-sync.log"
          PHONEBOOK_INTEGRITY_EVIDENCE="$evidence_dir/phonebook-integrity" node tests/phonebook-contact-integrity.browser.test.cjs 2>&1 | tee "$test_runtime/phonebook-integrity.log"
          PHONEBOOK_DELETE_UNDO_EVIDENCE="$evidence_dir/phonebook-delete-undo" node tests/phonebook-delete-undo.browser.test.cjs 2>&1 | tee "$test_runtime/phonebook-delete-undo.log"

      - name: Retain synthetic Phonebook browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phonebook-browser-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fcuno-phonebook-browser-evidence
